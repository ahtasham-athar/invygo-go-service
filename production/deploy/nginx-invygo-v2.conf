# Add this INSIDE the same server block as the existing  location /invygo/
# in /etc/nginx/sites-available/dashboard.convoi.ai  (server_name go.convoi.ai).
# Mirrors the pilot route exactly, just on port 8090 -> the new production service.
# Public URL becomes:  https://go.convoi.ai/invygo-v2/search

location /invygo-v2/ {
    proxy_pass http://localhost:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    rewrite ^/invygo-v2(/.*)$ $1 break;
}
