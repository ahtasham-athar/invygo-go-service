name: CI/CD Deploy to EC2

on:
  push:
    branches: [ main ]  # Trigger on pushes to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Navigate to the project directory
            cd ~/convoi_ai/invygo-go-service
            
            # 2. Pull the latest code
            git pull origin main
            
            # 3. Build the Go binary (Assuming Go is installed on the EC2)
            /usr/local/go/bin/go build -o invygo-service
            
            # 4. Reload and Restart Systemd service
            sudo systemctl daemon-reload
            sudo systemctl restart invygo.service

